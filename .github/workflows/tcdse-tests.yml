name: TCDSE automated tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcdse-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Python 3.10 geospatial test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install TCDSE and test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest azure-storage-blob

      - name: Check Python syntax
        run: python -m compileall -q tomorrowcities tests

      - name: Run complete automated test suite
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests -v --tb=short -ra

